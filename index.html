<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blanchori Safe Space</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ======================================
         CABEÇALHO
    ======================================= -->

    <header>

        <div class="logo">

            blanchori

            <span>
                safe space ♡
            </span>

        </div>


        <nav>

            <a
                href="index.html"
                class="active"
            >
                escrever
            </a>


            <a href="mensagens.html">
                mensagens
            </a>

        </nav>

    </header>



    <main>

        <!-- ==================================
             APRESENTAÇÃO
        =================================== -->

        <section class="hero hero-with-photo">


            <div class="hero-content">

                <p class="small-title">

                    ✦ NOSSO PEQUENO UNIVERSO

                </p>


                <h1>

                    escreva tudo o que
                    <span>você quiser.</span>

                </h1>


                <p class="description">

                    Um espaço seguro para deixar pensamentos,
                    mensagens, memórias e pequenas coisas
                    para a outra pessoa encontrar.

                </p>

            </div>



            <!-- FOTO -->

            <img
                src="foto.jpg"
                alt="Fotografia decorativa do Blanchori"
                class="foto-coracao"
            >

        </section>



        <!-- ==================================
             NOVA MENSAGEM
        =================================== -->

        <section class="note-section">


            <div class="note-title">

                <p>
                    ✦ NOVA MENSAGEM
                </p>


                <h2>

                    escreva aqui seu recado ♡

                </h2>

            </div>



            <div class="note">


                <!-- TÍTULO -->

                <input
                    type="text"
                    id="title"
                    placeholder="dê um título para sua mensagem..."
                >


                <hr>


                <!-- MENSAGEM -->

                <textarea
                    id="message"
                    placeholder="o que você está pensando?"
                    maxlength="30000"
                ></textarea>



                <!-- RODAPÉ -->

                <div class="note-footer">


                    <span id="counter">

                        0 / 30000

                    </span>


                    <button
                        type="button"
                        onclick="saveMessage()"
                    >

                        guardar mensagem ♡

                    </button>


                </div>


            </div>


        </section>


    </main>



    <!-- ======================================
         NOTIFICAÇÃO
    ======================================= -->

    <div id="toast">

        mensagem guardada ♡

    </div>



    <!-- ======================================
         SUPABASE
    ======================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ======================================
         JAVASCRIPT DO BLANCHORI
    ======================================= -->

    <script src="script.js"></script>


</body>

</html>
