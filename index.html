<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blanchori Safe Space</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <div class="logo">
            blanchori
            <span>safe space ♡</span>
        </div>


        <nav>

            <a href="blanchori.html" class="active">
                escrever
            </a>

            <a href="mensagens.html">
                mensagens
            </a>

        </nav>

    </header>


    <main>


        <section class="hero">

            <p class="small-title">
                ✦ NOSSO PEQUENO UNIVERSO
            </p>


            <h1>

                escreva tudo o que
                <span>você quiser.</span>

            </h1>


            <p class="description">

                Um espaço seguro para deixar pensamentos,
                mensagens, memórias e pequenas coisas
                para a outra pessoa encontrar.

            </p>

        </section>



        <section class="note-section">


            <div class="note-title">

                <p>✦ NOVA MENSAGEM</p>

                <h2>
                    escreva aqui seu recado ♡
                </h2>

            </div>



            <div class="note">


                <input
                    type="text"
                    id="title"
                    placeholder="dê um título para sua mensagem..."
                >


                <hr>


                <textarea
                    id="message"
                    placeholder="o que você está pensando?"
                    maxlength="1000"
                ></textarea>



                <div class="note-footer">

                    <span id="counter">
                        0 / 1000
                    </span>


                    <button onclick="saveMessage()">

                        guardar mensagem ♡

                    </button>

                </div>


            </div>


        </section>


    </main>



    <div id="toast">

        mensagem guardada ♡

    </div>


    <script src="script.js"></script>

</body>

</html>
